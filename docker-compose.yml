services:
  app:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - WORKER_ID=1
      - BASE_URL=http://localhost
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - SUPABASE_URL=${SUPABASE_URL}
    depends_on:
      redis:
        condition: service_healthy
      # mongo:
      #   condition: service_started
    restart: unless-stopped

  click-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["bun", "run", "worker/clickWorker.ts"]
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - SUPABASE_URL=${SUPABASE_URL}
    depends_on:
      redis:
        condition: service_healthy
      # mongo:
      #   condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-url-shortner
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # mongo:
  #   image: mongo:7
  #   container_name: mongo-url-shortner
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongo-data: